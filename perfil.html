<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu perfil | Ramos Academia de Boxe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,700;1,800&display=swap" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark">
            <div class="container-fluid justify-content-center">
                <a class="navbar-brand" href="index.html"><img src="logo.png" alt="Ramos Academia de Boxe"></a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Abrir menu">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse flex-grow-0 justify-content-center" id="navbarNav">
                    <ul class="navbar-nav text-center align-items-lg-center">
                        <li class="nav-item"><a class="nav-link" href="index.html">Produtos</a></li>
                        <li class="nav-item"><a class="nav-link" id="nav-carrinho" href="carrinho.html">Carrinho <span id="cart-count" class="badge bg-danger" hidden>0</span></a></li>
                        <li class="nav-item" id="nav-login"><a class="nav-link" href="login.html">Entrar</a></li>
                    </ul>
                    <div class="dropdown m-3">
                        <button id="user-info" class="btn btn-danger dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false" style="display: none">Olá</button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item active" href="perfil.html">Meu perfil</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="#" onclick="logout()">Sair</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <div class="cabecalho-pagina">
            <h1>Meu perfil</h1>
            <p>Seus dados cadastrais. Deixe a senha em branco para manter a atual.</p>
        </div>

        <form id="form_perfil" class="form-perfil">
            <label for="perfil-nome">Nome</label>
            <input type="text" id="perfil-nome" class="input_texto" required>
            <label for="perfil-cpf">CPF</label>
            <input type="text" id="perfil-cpf" class="input_texto" required>
            <label for="perfil-celular">Celular</label>
            <input type="tel" id="perfil-celular" class="input_texto" required>
            <label for="perfil-email">E-mail</label>
            <input type="email" id="perfil-email" class="input_texto" required>
            <label for="perfil-senha">Nova senha</label>
            <input type="password" id="perfil-senha" class="input_texto">
            <p class="senha-opcional">Opcional — só preencha se quiser trocar a senha.</p>
            <input type="submit" id="btn-salvar-perfil" value="Salvar alterações" class="btn_enviar">
        </form>

        <section class="secao-compras">
            <h2>Minhas compras</h2>
            <div id="historico-compras" class="lista-compras"></div>
        </section>
    </main>

    <div class="toast-area">
        <div id="liveToast" class="toast align-items-center text-white bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true" data-bs-delay="5000">
            <div class="d-flex">
                <div class="toast-body" id="toast-message">Mensagem</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Fechar"></button>
            </div>
        </div>
    </div>
    <footer>Ramos Academia de Boxe · Treino de boxe para todos os níveis</footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="./api.js"></script>
    <script src="./pages.js"></script>
    <script src="./perfil.js"></script>
</body>
</html>
